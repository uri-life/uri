name: Build, test, and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  VG_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos
            architecture: x86_64
            file_architecture: x86_64
            artifact: uri-macos-x86_64
            build_arguments: ""
          - os: macos-15
            platform: macos
            architecture: arm64
            file_architecture: arm64
            artifact: uri-macos-arm64
            build_arguments: ""
          - os: ubuntu-24.04
            platform: linux
            architecture: x86_64
            file_architecture: x86-64
            artifact: uri-linux-x86_64
            build_arguments: --static-swift-stdlib
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            file_architecture: aarch64
            artifact: uri-linux-arm64
            build_arguments: --static-swift-stdlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.3
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install Swiftly and Swift 6.3.3
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              curl -fsSL \
                "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" \
                -o "${RUNNER_TEMP}/swiftly.tar.gz"
              tar -xzf "${RUNNER_TEMP}/swiftly.tar.gz" -C "${RUNNER_TEMP}"
              _swiftly_executable="${RUNNER_TEMP}/swiftly"
              _swiftly_environment="${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
              ;;
            macOS)
              curl -fsSL \
                "https://download.swift.org/swiftly/darwin/swiftly.pkg" \
                -o "${RUNNER_TEMP}/swiftly.pkg"
              installer \
                -pkg "${RUNNER_TEMP}/swiftly.pkg" \
                -target CurrentUserHomeDirectory
              _swiftly_executable="${HOME}/.swiftly/bin/swiftly"
              _swiftly_environment="${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          "${_swiftly_executable}" init \
            --assume-yes \
            --no-modify-profile \
            --skip-install \
            --quiet-shell-followup
          # shellcheck source=/dev/null
          source "${_swiftly_environment}"
          _post_install_file="${RUNNER_TEMP}/swiftly-post-install.sh"
          swiftly install 6.3.3 \
            --assume-yes \
            --post-install-file="${_post_install_file}"
          if test -s "${_post_install_file}"; then
            if test "${RUNNER_OS}" = Linux; then
              sudo bash "${_post_install_file}"
            else
              bash "${_post_install_file}"
            fi
          fi
          dirname "$(command -v swiftly)" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        run: swiftly run swift --version +6.3.3

      - name: Discover tests
        run: swiftly run swift test list --scratch-path .build-ci-tests +6.3.3

      - name: Run complete test suite
        run: swiftly run swift test --scratch-path .build-ci-tests +6.3.3

      - name: Build release executable
        run: >-
          swiftly run swift build
          --scratch-path .build-ci-release
          --configuration release
          ${{ matrix.build_arguments }}
          +6.3.3

      - name: Verify and package executable
        shell: bash
        run: |
          set -euo pipefail
          _binary_directory="$(swiftly run swift build \
            --scratch-path .build-ci-release \
            --configuration release \
            ${{ matrix.build_arguments }} \
            --show-bin-path \
            +6.3.3)"
          _binary_path="${_binary_directory}/uri"
          test -x "${_binary_path}"
          "${_binary_path}" --help >/dev/null
          _version="$("${_binary_path}" --version)"
          if test "${GITHUB_REF_TYPE}" = tag; then
            _expected_version="${GITHUB_REF_NAME#v}"
            test "${_version}" = "${_expected_version}"
          else
            case "${_version}" in
              dev+*) ;;
              *) echo "Unexpected development version: ${_version}" >&2; exit 1 ;;
            esac
          fi
          _file_output="$(file "${_binary_path}")"
          echo "${_file_output}"
          printf '%s\n' "${_file_output}" | grep -Fq "${{ matrix.file_architecture }}"
          mkdir -p artifacts
          _archive="artifacts/${{ matrix.artifact }}.tar.gz"
          tar -czf "${_archive}" -C "${_binary_directory}" uri
          tar -tzf "${_archive}" | grep -Fxq uri
          (
            cd artifacts
            _archive_name="${{ matrix.artifact }}.tar.gz"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${_archive_name}" > "${_archive_name}.sha256"
            else
              shasum -a 256 "${_archive_name}" > "${_archive_name}.sha256"
            fi
          )

      - name: Upload packaged executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.artifact }}.tar.gz
            artifacts/${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v8
        with:
          pattern: uri-*
          path: artifacts
          merge-multiple: true

      - name: Verify checksums
        working-directory: artifacts
        run: sha256sum --check *.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*.tar.gz
          artifacts/*.sha256
          --generate-notes
          --verify-tag
