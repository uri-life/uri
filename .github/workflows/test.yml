name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellSpec
        run: git clone --depth=1 https://github.com/shellspec/shellspec.git "$HOME/.local/lib/shellspec"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Run unit tests
        run: |
          export PATH="$HOME/.local/lib/shellspec:$PATH"
          shellspec --format documentation

  integration-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellSpec
        run: git clone --depth=1 https://github.com/shellspec/shellspec.git "$HOME/.local/lib/shellspec"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Clone mastodon repository
        run: git clone --filter=blob:none https://github.com/uri-life/mastodon.git /tmp/mastodon-cache

      - name: Run integration tests
        run: |
          export PATH="$HOME/.local/lib/shellspec:$PATH"
          URI_MASTODON_REPO=/tmp/mastodon-cache URI_INTEGRATION_TEST=1 \
            shellspec spec/lib/commands/migrate_spec.sh --format documentation
